<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SlopHunter</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="loading">
    <main id="hunter" class="view" hidden>
      <header class="who">
        <span class="avatar">
          <img id="avatar" alt="" width="28" height="28" referrerpolicy="no-referrer" />
          <span id="initial" aria-hidden="true"></span>
        </span>
        <span id="handle" class="handle"></span>
        <svg class="x-logo" viewBox="0 0 24 24" role="img" aria-label="X account">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
        </svg>
      </header>

      <section class="reward">
        <output id="earnings" class="money">$0.00</output>
        <span class="label">This week · estimated</span>
      </section>

      <section class="stats">
        <div><strong id="points">0</strong><span class="label">Points</span></div>
        <div><strong id="rank">–</strong><span class="label">Rank</span></div>
        <div><strong id="confirmed">0</strong><span class="label">Confirmed</span></div>
      </section>

      <section id="ammo" class="ammo">
        <span id="bullets" class="bullets" role="img"></span>
        <span id="reload" class="label"></span>
      </section>
      <p id="stamp" class="stamp" hidden></p>

      <a id="dashboard" class="button" target="_blank" rel="noopener">Dashboard</a>
      <footer>
        <a data-link="privacy" class="link" target="_blank" rel="noopener">Privacy</a>
        <button id="disconnect" class="link" type="button">Disconnect</button>
      </footer>
    </main>

    <main id="welcome" class="view" hidden>
      <img class="mark" src="mark.svg" alt="" width="76" height="76" />
      <h1 class="headline">Hunt AI slop</h1>
      <a id="connect" class="button" target="_blank" rel="noopener">Connect X</a>
      <footer>
        <a data-link="privacy" class="link" target="_blank" rel="noopener">Privacy</a>
      </footer>
    </main>

    <template id="bullet">
      <svg viewBox="0 0 12 24" aria-hidden="true">
        <path d="M6 1C3.9 2.7 2.7 5.6 2.7 9.3V10.5h6.6V9.3C9.3 5.6 8.1 2.7 6 1Z" fill="#ea3d24" />
        <path d="M6 1C5 2 4.4 4 4.2 6.2" fill="none" stroke="#efeae1" stroke-opacity="0.45" stroke-width="0.8" stroke-linecap="round" />
        <path d="M2.5 10.5h7v11h-7z" fill="#efeae1" />
        <path d="M3.4 11.2v9.6" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.9" />
        <path d="M1.5 21.5h9v1.5h-9z" fill="#aaa398" />
      </svg>
    </template>
    <template id="bullet-spent">
      <svg viewBox="0 0 12 24" aria-hidden="true" data-spent fill="none" stroke="#4a463f" stroke-width="1">
        <path d="M2.5 10.5h7v11h-7z" />
        <path d="M1.5 21.5h9v1.5h-9z" />
      </svg>
    </template>
  </body>
</html>
