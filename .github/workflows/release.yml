name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Tag matches the manifest version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./src/manifest.json").version')"

      - run: npm test

      - name: Build the store package
        id: build
        run: |
          node scripts/build.mjs
          cd dist && sha256sum --check SHA256SUMS
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/slophunter-extension-${{ github.ref_name }}.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          cat > notes.md <<EOF
          SHA-256 of \`slophunter-extension-${GITHUB_REF_NAME}.zip\`:

          \`\`\`
          ${SHA256}
          \`\`\`

          Rebuild it yourself and compare:

          \`\`\`sh
          git checkout ${GITHUB_REF_NAME} && node scripts/build.mjs
          \`\`\`
          EOF
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS --title "${GITHUB_REF_NAME}" --notes-file notes.md
